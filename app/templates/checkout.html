{% extends "base.html" %}

{% block title %}Checkout - Tienda Eaciot{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-8">Checkout</h1>

<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <div>
        <h2 class="text-xl font-bold mb-4">Resumen del pedido</h2>
        <div class="bg-white rounded-lg shadow p-6">
            {% for item in items %}
            <div class="flex justify-between py-2 border-b">
                <span>{{ item.product.title }} x{{ item.quantity }}</span>
                <span>${{ item.subtotal }}</span>
            </div>
            {% endfor %}
            <div class="flex justify-between py-4 font-bold text-xl">
                <span>Total</span>
                <span>${{ total }}</span>
            </div>
        </div>
    </div>

    <div>
        <h2 class="text-xl font-bold mb-4">Datos de envío</h2>
        <form action="/checkout" method="POST" class="bg-white rounded-lg shadow p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nombre completo</label>
                <input type="text" name="name" required class="mt-1 block w-full border rounded-md px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" name="email" value="{{ user.email if user else '' }}" required class="mt-1 block w-full border rounded-md px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Dirección</label>
                <input type="text" name="address" required class="mt-1 block w-full border rounded-md px-3 py-2">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Ciudad</label>
                    <input type="text" name="city" required class="mt-1 block w-full border rounded-md px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Código postal</label>
                    <input type="text" name="postal_code" required class="mt-1 block w-full border rounded-md px-3 py-2">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">País</label>
                <input type="text" name="country" required class="mt-1 block w-full border rounded-md px-3 py-2">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700">
                Pagar con Stripe
            </button>
        </form>
    </div>
</div>
{% endblock %}
