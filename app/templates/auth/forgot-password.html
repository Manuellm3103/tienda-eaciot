{% extends "base.html" %}

{% block title %}Recuperar Contraseña - Tienda Eaciot{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Recuperar Contraseña
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Ingresa tu email y te enviaremos un enlace para restablecer tu contraseña.
            </p>
        </div>
        
        <form id="forgotForm" class="mt-8 space-y-6">
            <div>
                <label for="email" class="sr-only">Email</label>
                <input id="email" name="email" type="email" required 
                       class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" 
                       placeholder="Email">
            </div>

            <div>
                <button type="submit" 
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Enviar Enlace
                </button>
            </div>
            
            <div id="message" class="hidden text-center text-sm"></div>
        </form>
        
        <div class="text-center">
            <a href="/auth/login" class="font-medium text-blue-600 hover:text-blue-500">
                Volver al login
            </a>
        </div>
    </div>
</div>

<script>
document.getElementById('forgotForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const messageDiv = document.getElementById('message');
    
    try {
        const response = await fetch(`/auth/forgot-password?email=${encodeURIComponent(email)}`, {
            method: 'POST',
        });
        
        messageDiv.textContent = 'Si el email existe, recibirás un enlace para restablecer tu contraseña.';
        messageDiv.className = 'text-green-600 text-center text-sm';
        messageDiv.classList.remove('hidden');
    } catch (error) {
        messageDiv.textContent = 'Error de conexión';
        messageDiv.className = 'text-red-600 text-center text-sm';
        messageDiv.classList.remove('hidden');
    }
});
</script>
{% endblock %}
