{% extends "base.html" %}

{% block title %}Restablecer Contraseña - Tienda Eaciot{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Restablecer Contraseña
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Ingresa tu nueva contraseña.
            </p>
        </div>
        
        <form id="resetForm" class="mt-8 space-y-6">
            <input type="hidden" id="token" value="{{ token }}">
            
            <div class="space-y-4">
                <div>
                    <label for="password" class="sr-only">Nueva Contraseña</label>
                    <input id="password" name="password" type="password" required 
                           class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" 
                           placeholder="Nueva contraseña (mínimo 8 caracteres)">
                </div>
                <div>
                    <label for="confirm-password" class="sr-only">Confirmar Contraseña</label>
                    <input id="confirm-password" name="confirm-password" type="password" required 
                           class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" 
                           placeholder="Confirmar nueva contraseña">
                </div>
            </div>

            <div>
                <button type="submit" 
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Restablecer Contraseña
                </button>
            </div>
            
            <div id="message" class="hidden text-center text-sm"></div>
        </form>
    </div>
</div>

<script>
document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const token = document.getElementById('token').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const messageDiv = document.getElementById('message');
    
    if (password !== confirmPassword) {
        messageDiv.textContent = 'Las contraseñas no coinciden';
        messageDiv.className = 'text-red-600 text-center text-sm';
        messageDiv.classList.remove('hidden');
        return;
    }
    
    if (password.length < 8) {
        messageDiv.textContent = 'La contraseña debe tener al menos 8 caracteres';
        messageDiv.className = 'text-red-600 text-center text-sm';
        messageDiv.classList.remove('hidden');
        return;
    }
    
    try {
        const response = await fetch(`/auth/reset-password?token=${token}&new_password=${encodeURIComponent(password)}`, {
            method: 'POST',
        });
        
        if (response.ok) {
            messageDiv.textContent = '¡Contraseña restablecida! Redirigiendo al login...';
            messageDiv.className = 'text-green-600 text-center text-sm';
            messageDiv.classList.remove('hidden');
            setTimeout(() => {
                window.location.href = '/auth/login';
            }, 2000);
        } else {
            const data = await response.json();
            messageDiv.textContent = data.detail || 'Error al restablecer contraseña';
            messageDiv.className = 'text-red-600 text-center text-sm';
            messageDiv.classList.remove('hidden');
        }
    } catch (error) {
        messageDiv.textContent = 'Error de conexión';
        messageDiv.className = 'text-red-600 text-center text-sm';
        messageDiv.classList.remove('hidden');
    }
});
</script>
{% endblock %}
