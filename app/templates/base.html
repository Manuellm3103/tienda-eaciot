<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tienda Eaciot{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script>
        window.getCsrfToken = function() {
            const match = document.cookie.match(new RegExp('(^| )csrf_token=([^;]+)'));
            return match ? decodeURIComponent(match[2]) : '';
        };
        document.addEventListener('htmx:configRequest', function(evt) {
            if (evt.detail.verb !== 'get') {
                evt.detail.headers['X-CSRF-Token'] = window.getCsrfToken();
            }
        });
    </script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-2">
                        <img src="/static/images/logo.png" alt="Tienda Eaciot" class="h-10 w-auto">
                        <span class="text-xl font-bold">Tienda Eaciot</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/products" class="hover:text-blue-600">Productos</a>
                    <a href="/wishlist/page" class="hover:text-blue-600">Wishlist</a>
                    <a href="/cart" class="hover:text-blue-600">Carrito <span id="cart-count" class="bg-red-500 text-white text-xs rounded-full px-2 py-1"></span></a>
                    <form action="/search" method="GET" class="flex">
                        <input type="text" name="q" placeholder="Buscar..." class="border rounded-l-md px-3 py-1 text-sm">
                        <button type="submit" class="bg-blue-600 text-white px-3 py-1 rounded-r-md text-sm">Buscar</button>
                    </form>
                    {% if user %}
                        <a href="/account" class="hover:text-blue-600">Mi Cuenta</a>
                        <a href="/loyalty/" class="hover:text-blue-600">Fidelidad</a>
                        <a href="/auth/logout" class="hover:text-red-600">Salir</a>
                    {% else %}
                        <a href="/auth/login" class="bg-blue-600 text-white px-4 py-2 rounded">Iniciar Sesión</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-white py-8 mt-16">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>&copy; 2026 Tienda Eaciot. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
