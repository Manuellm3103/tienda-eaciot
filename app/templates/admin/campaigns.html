{% extends "base.html" %}

{% block title %}Campañas IA - Tienda Eaciot{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-bold">Campañas IA</h1>
    <div class="space-x-2">
        <a href="/admin/dashboard" class="bg-gray-600 text-white px-4 py-2 rounded">Dashboard</a>
    </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="bg-white rounded-lg shadow p-6 text-center">
        <p class="text-gray-500 text-sm">Activas/Programadas</p>
        <p id="count-active" class="text-3xl font-bold">—</p>
    </div>
    <div class="bg-white rounded-lg shadow p-6 text-center">
        <p class="text-gray-500 text-sm">Completadas</p>
        <p id="count-completed" class="text-3xl font-bold text-emerald-600">—</p>
    </div>
    <div class="bg-white rounded-lg shadow p-6 text-center">
        <p class="text-gray-500 text-sm">Pausadas</p>
        <p id="count-paused" class="text-3xl font-bold text-amber-600">—</p>
    </div>
</div>

<div class="bg-white rounded-lg shadow p-6 mb-8">
    <h2 class="text-xl font-bold mb-4">Nueva campaña</h2>
    <form id="create-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" name="name" placeholder="Nombre de la campaña" required
               class="border border-gray-300 rounded-lg px-4 py-2">
        <select name="campaign_type" class="border border-gray-300 rounded-lg px-4 py-2">
            <option value="seasonal">Estacional</option>
            <option value="post_purchase">Post-compra</option>
            <option value="cross_sell">Cross-sell</option>
            <option value="review_request">Solicitud de reseña</option>
            <option value="win_back">Win-back</option>
            <option value="new_arrival">Nuevos productos</option>
        </select>
        <input type="text" name="subject" placeholder="Asunto del email" required
               class="border border-gray-300 rounded-lg px-4 py-2 md:col-span-2">
        <textarea name="body" placeholder="Cuerpo del email" required rows="3"
                  class="border border-gray-300 rounded-lg px-4 py-2 md:col-span-2"></textarea>
        <div class="md:col-span-2">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg">
                Crear campaña
            </button>
        </div>
    </form>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="w-full">
        <thead class="bg-gray-50">
            <tr>
                <th class="text-left py-3 px-4">Nombre</th>
                <th class="text-left py-3 px-4">Tipo</th>
                <th class="text-left py-3 px-4">Estado</th>
                <th class="text-left py-3 px-4">Programada</th>
                <th class="text-left py-3 px-4">Ejecutada</th>
                <th class="py-3 px-4">Acciones</th>
            </tr>
        </thead>
        <tbody id="campaigns-body">
            <tr><td colspan="6" class="py-4 text-center text-gray-400">Cargando…</td></tr>
        </tbody>
    </table>
</div>

<script>
(function() {
    function csrfToken() {
        const m = document.cookie.match(/(?:^|;\s*)csrf_token=([^;]+)/);
        return m ? decodeURIComponent(m[1]) : '';
    }

    async function postJson(url, body) {
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'same-origin',
            body: JSON.stringify({...body, _csrf_token: csrfToken()})
        });
        return await res.json();
    }

    async function load() {
        try {
            const res = await fetch('/admin/campaigns/list', {credentials: 'same-origin'});
            const data = await res.json();
            const counts = {active: 0, scheduled: 0, completed: 0, paused: 0};
            const body = document.getElementById('campaigns-body');
            body.innerHTML = (data.campaigns || []).map(c => {
                counts[c.status] = (counts[c.status] || 0) + 1;
                const canRun = c.status !== 'completed';
                const canPause = c.status === 'active' || c.status === 'scheduled';
                return '<tr class="border-b hover:bg-gray-50">' +
                    '<td class="py-3 px-4">' + c.name + '</td>' +
                    '<td class="py-3 px-4">' + c.type + '</td>' +
                    '<td class="py-3 px-4"><span class="inline-block px-2 py-1 rounded text-xs font-medium ' +
                        (c.status === 'completed' ? 'bg-emerald-100 text-emerald-700' :
                         c.status === 'paused' ? 'bg-amber-100 text-amber-700' :
                         'bg-blue-100 text-blue-700') + '">' + c.status + '</span></td>' +
                    '<td class="py-3 px-4">' + (c.scheduled_at ? new Date(c.scheduled_at).toLocaleString() : '—') + '</td>' +
                    '<td class="py-3 px-4">' + (c.executed_at ? new Date(c.executed_at).toLocaleString() : '—') + '</td>' +
                    '<td class="py-3 px-4 space-x-2">' +
                        (canRun ? '<button class="run-btn text-emerald-600 hover:text-emerald-800 text-sm" data-id="' + c.id + '">Ejecutar</button>' : '') +
                        (canPause ? '<button class="toggle-btn text-blue-600 hover:text-blue-800 text-sm" data-id="' + c.id + '">Pausar</button>' :
                         (c.status === 'paused' ? '<button class="toggle-btn text-blue-600 hover:text-blue-800 text-sm" data-id="' + c.id + '">Activar</button>' : '')) +
                    '</td>' +
                '</tr>';
            }).join('') || '<tr><td colspan="6" class="py-4 text-center text-gray-400">No hay campañas.</td></tr>';

            document.getElementById('count-active').textContent = (counts.active || 0) + (counts.scheduled || 0);
            document.getElementById('count-completed').textContent = counts.completed || 0;
            document.getElementById('count-paused').textContent = counts.paused || 0;

            bindActions();
        } catch (err) {
            document.getElementById('campaigns-body').innerHTML =
                '<tr><td colspan="6" class="py-4 text-center text-red-500">No se pudo cargar.</td></tr>';
        }
    }

    function bindActions() {
        document.querySelectorAll('.run-btn').forEach(btn => {
            btn.addEventListener('click', async function() {
                if (!confirm('¿Ejecutar esta campaña ahora?')) return;
                const id = btn.getAttribute('data-id');
                await postJson('/admin/campaigns/' + id + '/run', {});
                load();
            });
        });
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', async function() {
                const id = btn.getAttribute('data-id');
                await postJson('/admin/campaigns/' + id + '/toggle', {});
                load();
            });
        });
    }

    document.getElementById('create-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const form = e.target;
        const body = {
            name: form.name.value,
            campaign_type: form.campaign_type.value,
            subject: form.subject.value,
            body: form.body.value,
        };
        await postJson('/admin/campaigns/create', body);
        form.reset();
        load();
    });

    load();
})();
</script>
{% endblock %}
