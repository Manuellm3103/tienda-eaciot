# Tienda Eaciot — despliegue autohospedado (Coolify / Dokploy / Docker Compose).
#
# Sustituye a Render. El contenedor es el mismo Dockerfile que ya corre en
# producción; la única diferencia real es que aquí la BD vive en un volumen
# Docker (app-data) en lugar del disk mount de Render.
#
# Uso local (sin Coolify):
#   cp .env.example .env   # rellena los secretos (APP_SECRET_KEY, Stripe, etc.)
#   docker compose up -d --build
#
# En Coolify: crea una aplicación con build pack "Docker Compose" (o "Dockerfile"),
# apunta a este repo, expone el puerto 8000 y pon el dominio tienda.eaciot.com.
# Coolify añade Traefik + Let's Encrypt (HTTPS) automáticamente.

services:
  app:
    build: .
    container_name: tienda-eaciot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Persistencia real: SQLite y uploads viven en el volumen, no en el
      # filesystem efímero del contenedor (sobrevive redeploys y reinicios).
      DATABASE_URL: sqlite+aiosqlite:////var/data/app.db
      UPLOAD_DIR: /var/data/uploads
      PORT: "8000"
      # Detrás del proxy de Coolify/Dokploy (termina TLS), uvicorn debe confiar
      # en X-Forwarded-Proto para no entrar en bucle de redirección HTTPS.
      FORCE_HTTPS: "true"
    volumes:
      - app-data:/var/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  app-data:
