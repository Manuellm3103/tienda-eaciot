services:
  - type: web
    name: tienda-eaciot
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    releaseCommand: "bash scripts/release.sh"
    startCommand: "bash scripts/start.sh"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./app.db
      - key: FRONTEND_URL
        value: https://tienda.eaciot.com
      - key: FORCE_HTTPS
        value: "true"
      - key: ALLOWED_HOSTS
        value: "tienda.eaciot.com,www.tienda.eaciot.com,tienda-eaciot.onrender.com"
      # Secrets + provider keys — set the real values in the Render dashboard.
      # sync:false means Render will NOT overwrite them with a blank value.
      - key: APP_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # AI providers
      # NOTE: OLLAMA_HOST must be the API endpoint (e.g. https://api.ollama.com),
      # NOT the marketing site https://ollama.com — the client POSTs to
      # {OLLAMA_HOST}/api/generate.
      - key: OLLAMA_HOST
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: OPENCODE_HOST
        sync: false
      - key: OPENCODE_MODEL
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
      # OAuth (Google / Microsoft / GitHub)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_REDIRECT_URI
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      # CFDI nativo (satcfdi + PAC) — sin límite mensual
      - key: PAC_PROVIDER
        value: finkok
      - key: PAC_USERNAME
        sync: false
      - key: PAC_PASSWORD
        sync: false
      - key: PAC_ENVIRONMENT
        value: test
      - key: CSD_CERT_PATH
        value: /etc/secrets/CSD.cer
      - key: CSD_KEY_PATH
        value: /etc/secrets/CSD.key
      - key: CSD_PASSWORD
        sync: false
      - key: BUSINESS_ZIP_CODE
        value: "62410"
      - key: BUSINESS_IVA_RATE
        value: "0.16"
      # CFDI alternativo (Facturapi) — vacío emite comprobante provisional
      - key: FACTURAPI_API_KEY
        sync: false
      - key: FACTURAPI_BASE_URL
        sync: false
      - key: BUSINESS_RFC
        value: EAC2403183F0
      - key: BUSINESS_NAME
        value: EMANUEL AZUR CORPORATIVO SAS DE CV
      - key: BUSINESS_TAX_REGIME
        value: "601"
    disk:
      name: tienda-data
      mountPath: /opt/render/project/src
      sizeGB: 1
