services:
  - type: web
    name: tienda-eaciot
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    releaseCommand: "bash scripts/release.sh"
    startCommand: "bash scripts/start.sh"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./app.db
      - key: FRONTEND_URL
        value: https://tienda.eaciot.com
      - key: FORCE_HTTPS
        value: "true"
      - key: ALLOWED_HOSTS
        value: "tienda.eaciot.com,www.tienda.eaciot.com,tienda-eaciot.onrender.com"
      # Secrets + provider keys — set the real values in the Render dashboard.
      # sync:false means Render will NOT overwrite them with a blank value.
      - key: APP_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # AI providers
      - key: OLLAMA_HOST
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: OPENCODE_HOST
        sync: false
      - key: OPENCODE_MODEL
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
      # CFDI nativo (satcfdi + PAC) — sin límite mensual
      - key: PAC_PROVIDER
        sync: false
      - key: PAC_USERNAME
        sync: false
      - key: PAC_PASSWORD
        sync: false
      - key: PAC_ENVIRONMENT
        sync: false
      - key: CSD_CERT_PATH
        sync: false
      - key: CSD_KEY_PATH
        sync: false
      - key: CSD_PASSWORD
        sync: false
      - key: BUSINESS_ZIP_CODE
        sync: false
      - key: BUSINESS_IVA_RATE
        sync: false
      # CFDI alternativo (Facturapi) — vacío emite comprobante provisional
      - key: FACTURAPI_API_KEY
        sync: false
      - key: FACTURAPI_BASE_URL
        sync: false
      - key: BUSINESS_RFC
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: BUSINESS_TAX_REGIME
        sync: false
    disk:
      name: tienda-data
      mountPath: /opt/render/project/src
      sizeGB: 1
